name: Evercrafted SaaS Foundation Typecheck

on:
  push:
    branches: [saas-foundation]
    paths:
      - "apps/studio/**"
      - ".github/workflows/saas-foundation-typecheck.yml"
  pull_request:
    paths:
      - "apps/studio/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
