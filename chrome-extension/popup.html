<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wreath Weaver Importer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1E3A5F 0%, #2D5A87 100%);
      color: white;
      padding: 16px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    
    .header-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .status {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    
    .status-row:last-child {
      margin-bottom: 0;
    }
    
    .status-label {
      color: rgba(255,255,255,0.7);
    }
    
    .status-value {
      font-weight: 500;
    }
    
    .status-value.connected {
      color: #4ADE80;
    }
    
    .status-value.disconnected {
      color: #F87171;
    }
    
    .products-found {
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    
    .products-count {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .products-label {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: white;
      color: #1E3A5F;
    }
    
    .btn-primary:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.3);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .loading.active {
      display: flex;
    }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    
    .message.success {
      display: block;
      background: rgba(74, 222, 128, 0.2);
      color: #4ADE80;
    }
    
    .message.error {
      display: block;
      background: rgba(248, 113, 113, 0.2);
      color: #F87171;
    }
    
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🌿</div>
    <h1>Wreath Weaver Importer</h1>
  </div>
  
  <div class="status">
    <div class="status-row">
      <span class="status-label">App Status:</span>
      <span class="status-value" id="appStatus">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Current Site:</span>
      <span class="status-value" id="currentSite">-</span>
    </div>
  </div>
  
  <div class="products-found">
    <div class="products-count" id="productCount">-</div>
    <div class="products-label">Products detected on this page</div>
  </div>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
  </div>
  
  <div class="actions" id="actions">
    <button class="btn-primary" id="importAll" disabled>
      <span>📦</span>
      Import All Products
    </button>
    <button class="btn-secondary" id="importSelected" disabled>
      <span>📌</span>
      Import Current Product
    </button>
    <button class="btn-secondary" id="scanPage">
      <span>🔍</span>
      Re-scan Page
    </button>
  </div>
  
  <div class="message" id="message"></div>
  
  <div class="footer">
    Open Wreath Weaver app to receive imports
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
